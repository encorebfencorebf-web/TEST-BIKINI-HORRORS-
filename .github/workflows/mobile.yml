
name: Android Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  NDK_VERSION: r27c
  LIBS_CACHE_VERSION: v6
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.vfs.watch=false

jobs:
  android:
    name: Android Build (ARM64)
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Find Android NDK
        id: find-ndk
        shell: bash
        run: |
          for dir in $(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V -r); do
            if [ -x "$dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
              echo "Using preinstalled NDK: $dir"
              echo "path=$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No preinstalled NDK found."

      - name: Setup Android NDK
        id: setup-ndk
        if: steps.find-ndk.outputs.path == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Use all CPU cores
        run: echo "HXCPP_COMPILE_THREADS=$(nproc)" >> "$GITHUB_ENV"

      - name: Restore libraries cache
        id: libs-cache
        uses: actions/cache/restore@v6
        with:
          path: .haxelib
          key: libs-android-${{ env.LIBS_CACHE_VERSION }}-${{ hashFiles('building/libs.xml') }}

      - name: Restore compile cache
        uses: actions/cache@v6
        with:
          path: .hxcpp_cache
          key: hxcpp-android-${{ github.run_id }}
          restore-keys: hxcpp-android-

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('project.xml', 'android/**') }}
          restore-keys: gradle-android-

      - name: Update haxelib
        run: haxelib --global update haxelib

      - name: Install libraries
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -si
          bash building/patch-lime-mobile.sh

      - name: Configure Lime for Android
        shell: bash
        run: |
          NDK="${{ steps.find-ndk.outputs.path }}"
          if [ -z "$NDK" ]; then
            NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          fi

          if [ -z "$NDK" ] || [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            echo "Android NDK is missing or invalid."
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOST=linux-x86_64" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME" -nocffi
          haxelib run lime config ANDROID_NDK_ROOT "$NDK" -nocffi
          haxelib run lime config JAVA_HOME "$JAVA_HOME" -nocffi
          haxelib run lime config ANDROID_SETUP true -nocffi

      - name: Install Lime build dependencies
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -qq \
            libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev libdbus-1-dev libdecor-0-dev libudev-dev libgbm-dev libdrm-dev \
            libpng-dev libturbojpeg-dev libvorbis-dev libopenal-dev libsdl2-dev libglu1-mesa-dev libmbedtls-dev libuv1-dev libsqlite3-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libwayland-dev libwayland-bin wayland-protocols

      - name: Rebuild Lime and Hxcpp
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild hxcpp -nocffi
          LIME_PROJECT="$(haxelib libpath lime)/project"
          PROTOCOLS="$LIME_PROJECT/lib/sdl/wayland-protocols"
          GENERATED="$LIME_PROJECT/lib/sdl/wayland-generated-protocols"

          mkdir -p "$GENERATED"

          for xml in "$PROTOCOLS"/*.xml; do
            name="$(basename "$xml" .xml)-client-protocol"
            wayland-scanner client-header "$xml" "$GENERATED/$name.h"
            wayland-scanner private-code "$xml" "$GENERATED/$name.c"
          done

          haxelib run lime rebuild linux -64 -release -nocolor -nocffi
          haxelib run lime rebuild tools
          haxelib run lime rebuild android -release -nocolor -arm64

      - name: Save libraries cache
        if: steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .haxelib
          key: ${{ steps.libs-cache.outputs.cache-primary-key }}

      - name: Remove stale precompiled headers
        run: |
          if [ -d .hxcpp_cache ]; then
            find .hxcpp_cache -type d -name "pch*" -prune -exec rm -rf {} +
          fi

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle/init.d

          cat > ~/.gradle/init.d/fast-build.gradle <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.startsWith('lintVital') ||
                      task.name.startsWith('lintAnalyze') ||
                      task.name.startsWith('generateReleaseLintVital')) {
                      task.enabled = false
                  }
              }

              afterEvaluate { project ->
                  def android = project.extensions.findByName('android')
                  if (android != null) {
                      try {
                          android.lint.checkReleaseBuilds = false
                      } catch (ignored) {}

                      try {
                          android.androidResources.noCompress.addAll([
                              '.png', '.ogg', '.mp3', '.wav', '.ttf',
                              '.otf', '.xml', '.json', '.txt', '.hx',
                              '.hscript', '.frag', '.vert', '.lua',
                              '.ini', '.csv', '.mp4', '.webm',
                              '.zip', '.version'
                          ])
                      } catch (ignored) {}
                  }
              }
          }
          EOF

      - name: Build Android
        run: |
          haxelib run lime build android -release -arm64 -DCOMPILE_EXPERIMENTAL

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(find export/release/android/bin -name "*.apk" -print -quit)

          if [ -z "$UNSIGNED" ]; then
            echo "No APK was generated."
            exit 1
          fi

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

            : "${KEYSTORE_PASSWORD:?Missing keystore password}"
            : "${KEY_ALIAS:?Missing key alias}"
            : "${KEY_PASSWORD:?Missing key password}"
          else
            KEYSTORE_PASSWORD=codename
            KEY_ALIAS=codename
            KEY_PASSWORD=codename
            cp building/codename-mobile.keystore keystore.jks
          fi

          mkdir -p build

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" build/aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/CodenameEngine-arm64.apk \
            build/aligned.apk

          "$BUILD_TOOLS/apksigner" verify build/CodenameEngine-arm64.apk

          rm -f keystore.jks build/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Codename-Engine-Android-ARM64
          path: build/CodenameEngine-arm64.apk
          if-no-files-found: error
          compression-level: 0
